name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer and portable
        run: npm run dist -- --publish never

      - name: Pack portable ZIP and checksums
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $zip = "release/KubikLauncher-$version-portable.zip"
          tar -a -c -f $zip -C release/win-unpacked .
          $files = @(
            "release/KubikLauncher-Setup-$version.exe",
            $zip
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLower()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content -Encoding ascii release/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KubikLauncher-${{ steps.version.outputs.value }}-windows
          path: |
            release/KubikLauncher-Setup-*.exe
            release/KubikLauncher-Setup-*.exe.blockmap
            release/KubikLauncher-*-portable.zip
            release/SHA256SUMS.txt
            release/latest.yml
          if-no-files-found: error

      - name: Attach files to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $tag = "v$version"
          $assets = @(
            "release/KubikLauncher-Setup-$version.exe",
            "release/KubikLauncher-Setup-$version.exe.blockmap",
            "release/KubikLauncher-$version-portable.zip",
            "release/SHA256SUMS.txt",
            "release/latest.yml"
          )
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            $notes = "release/notes-$version.md"
            if (Test-Path $notes) {
              gh release create $tag --title "Kubik Launcher $version" --notes-file $notes
            } else {
              gh release create $tag --title "Kubik Launcher $version" --notes "Kubik Launcher $version"
            }
          }
          foreach ($asset in $assets) {
            gh release upload $tag $asset --clobber
          }

      - name: VirusTotal report and site link
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if (-not $env:VT_API_KEY) {
            Write-Host "Секрет VT_API_KEY не задан — отчёт VirusTotal пропущен."
            exit 0
          }
          $version = "${{ steps.version.outputs.value }}"
          $setup = "release/KubikLauncher-Setup-$version.exe"
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLower()
          Write-Host "Отправляю $setup в VirusTotal ($sha)"

          $upload = curl.exe -sS --request POST `
            --url https://www.virustotal.com/api/v3/files `
            --header "x-apikey: $env:VT_API_KEY" `
            --form "file=@$setup" | ConvertFrom-Json
          $analysisId = $upload.data.id
          if (-not $analysisId) {
            Write-Host "VirusTotal не вернул id анализа, шаг пропущен."
            exit 0
          }

          $status = ""
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 20
            $report = curl.exe -sS --url "https://www.virustotal.com/api/v3/analyses/$analysisId" `
              --header "x-apikey: $env:VT_API_KEY" | ConvertFrom-Json
            $status = $report.data.attributes.status
            Write-Host "попытка $($i + 1): статус $status"
            if ($status -eq "completed") { break }
          }
          if ($status -ne "completed") {
            Write-Host "VirusTotal не успел закончить анализ — ссылку не трогаю."
            exit 0
          }

          $stats = $report.data.attributes.stats
          Write-Host "Обнаружений: $($stats.malicious) из $($stats.malicious + $stats.undetected)"

          $link = "https://www.virustotal.com/gui/file/$sha"
          $docs = "docs/index.html"
          $html = Get-Content -LiteralPath $docs -Raw
          $updated = [regex]::Replace($html, 'https://www\.virustotal\.com/gui/file/[0-9a-fA-F]{64}', $link)
          if ($updated -ne $html) {
            Set-Content -LiteralPath $docs -Value $updated -Encoding UTF8 -NoNewline
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $docs
            git commit -m "docs: отчёт VirusTotal для $version"
            git push
            Write-Host "Сайт обновлён: $link"
          } else {
            Write-Host "Ссылка уже указывает на $sha"
          }
