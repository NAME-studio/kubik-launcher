    <div class="app">
      <header class="titlebar">
        <div class="tb-brand">
          <span class="tb-logo">
            <svg viewBox="0 0 32 32" class="logo-mark"><path d="M16 3 28 9.5v13L16 29 4 22.5v-13L16 3Z" fill="url(#gradLogo)" /><path d="m4 9.5 12 6.5 12-6.5" stroke="#08120a" stroke-width="1.6" fill="none" opacity=".45" /><path d="M16 16v13" stroke="#08120a" stroke-width="1.6" opacity=".45" /><defs><linearGradient id="gradLogo" x1="0" y1="0" x2="32" y2="32"><stop offset="0" stop-color="#9df07a" /><stop offset="1" stop-color="#35c9a1" /></linearGradient></defs></svg>
          </span>
          <span class="tb-title">Kubik Launcher</span>
          <span class="tb-ver" id="tb-version"></span>
        </div>
        <div class="tb-drag"></div>
        <div class="tb-controls">
          <button class="tb-btn" data-win="min" title="Свернуть"><svg class="icon"><use href="#i-min" /></svg></button>
          <button class="tb-btn" data-win="max" title="Развернуть"><svg class="icon"><use href="#i-max" /></svg></button>
          <button class="tb-btn danger" data-win="close" title="Закрыть"><svg class="icon"><use href="#i-x" /></svg></button>
        </div>
      </header>

      <div class="shell">
        <aside class="sidebar">
          <nav class="nav" id="nav">
            <button class="nav-item" data-route="home"><svg class="icon"><use href="#i-home" /></svg><span>Главная</span></button>
            <button class="nav-item" data-route="instances"><svg class="icon"><use href="#i-layers" /></svg><span>Сборки</span></button>
            <button class="nav-item" data-route="versions"><svg class="icon"><use href="#i-cube" /></svg><span>Версии</span></button>
            <div class="nav-sep">Контент</div>
            <button class="nav-item" data-route="mods"><svg class="icon"><use href="#i-puzzle" /></svg><span>Моды</span></button>
            <button class="nav-item" data-route="modpacks"><svg class="icon"><use href="#i-package" /></svg><span>Модпаки</span></button>
            <button class="nav-item" data-route="resourcepacks"><svg class="icon"><use href="#i-image" /></svg><span>Ресурспаки</span></button>
            <button class="nav-item" data-route="shaders"><svg class="icon"><use href="#i-sparkles" /></svg><span>Шейдеры</span></button>
            <button class="nav-item" data-route="servers"><svg class="icon"><use href="#i-server" /></svg><span>Серверы</span></button>
            <div class="nav-sep">Общение</div>
            <button class="nav-item" data-route="friends"><svg class="icon"><use href="#i-users" /></svg><span>Друзья</span></button>
            <div class="nav-sep">Персонаж</div>
            <button class="nav-item" data-route="skins"><svg class="icon"><use href="#i-shirt" /></svg><span>Скины</span></button>
            <div class="nav-sep">Система</div>
            <button class="nav-item" data-route="logs"><svg class="icon"><use href="#i-terminal" /></svg><span>Логи</span></button>
            <button class="nav-item" data-route="settings"><svg class="icon"><use href="#i-settings" /></svg><span>Настройки</span></button>
          </nav>

          <button class="account-card" id="account-card">
            <span class="account-avatar" id="account-avatar"><svg class="icon"><use href="#i-user" /></svg></span>
            <span class="account-meta">
              <strong id="account-name">Войти в аккаунт</strong>
              <small id="account-sub">офлайн, Ely.by или Microsoft</small>
            </span>
            <svg class="icon account-chevron"><use href="#i-chevron-right" /></svg>
          </button>
        </aside>

        <main class="main">
          <header class="page-head">
            <div class="page-head-text">
              <div class="page-kicker" id="page-kicker"></div>
              <h1 id="page-title">Главная</h1>
            </div>
            <div class="page-actions" id="page-actions"></div>
          </header>
          <section class="page" id="page"></section>
        </main>
      </div>
    </div>

    <div class="modal-root" id="modal-root"></div>
    <div class="toast-root" id="toast-root"></div>
